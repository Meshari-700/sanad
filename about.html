<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>حول سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="settings.html" id="crumb">الإعدادات</a>
    <h1 class="page-title" style="margin-bottom:20px">حول سند</h1>
    <div class="card about-text">
      <p>سند مرجع ميداني للمفتش: يجمع اشتراطات كل نشاط في مكان واحد، مرتبة على شكل اشتراطات وبنود، مع الملاحظات والصور التوضيحية لكل بند.</p>
      <p>ابحث عن النشاط، افتح اشتراطاته، واحفظ البنود اللي ترجع لها كثير في المفضلة. والتوجيهات الجديدة من الإدارة تظهر في تبويب التوجيهات.</p>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script>
    // صفحة عامة: تُعرض للزائر بدون شريط سفلي، وللمسجّل بالتنقل الكامل
    (async () => {
      renderHeader();
      document.getElementById("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));
      const profile = await getCurrentProfile();
      if (profile && !profile.is_disabled) {
        renderBottomNav("settings");
        updateDirectivesDot();
      } else {
        const crumb = document.getElementById("crumb");
        crumb.href = "login.html";
        crumb.lastChild.textContent = "تسجيل الدخول";
      }
    })();
  </script>
</body>
</html>
