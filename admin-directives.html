<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>إدارة التوجيهات — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="admin.html" id="crumb">لوحة الإشراف</a>
    <div class="page-head">
      <div>
        <h1 class="page-title">التوجيهات</h1>
      </div>
      <button class="icon-btn round primary" id="addBtn" aria-label="نشر توجيه جديد"></button>
    </div>
    <div id="list"><div class="card skeleton" style="height:130px"></div></div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="content.js"></script>
  <script src="admin.js"></script>
  <script src="admin-ui.js"></script>
  <script>
    let items = [];
    let activeUsers = 0;

    function render() {
      const list = document.getElementById("list");
      if (!items.length) {
        list.innerHTML = `<div class="empty"><strong>لا توجد توجيهات</strong></div>`;
        return;
      }
      list.innerHTML = items.map((d, i) => `
        <article class="card directive">
          <div class="directive-meta">
            <span class="directive-date">${formatDate(d.created_at)}</span>
            <span class="spacer" style="flex:1"></span>
            <span class="stat">قرأه ${d.reads} من ${activeUsers}</span>
          </div>
          <h2 class="directive-title">${escapeHtml(d.title)}</h2>
          ${d.content ? `<p class="directive-body is-clamped">${escapeHtml(d.content)}</p>` : ""}
          ${directivePhotosHtml(d)}
          <button class="more-btn hidden" data-more aria-expanded="false">المزيد</button>
          <div class="row-actions" style="margin-top:14px">
            <button class="mini-btn" data-act="edit" data-i="${i}" aria-label="تعديل">${svgIcon("edit")}</button>
            <button class="mini-btn danger" data-act="delete" data-i="${i}" aria-label="حذف">${svgIcon("trash")}</button>
          </div>
        </article>`).join("");
      list.querySelectorAll(".directive").forEach((card) => {
        const b = card.querySelector(".directive-body");
        const long = b && b.scrollHeight > b.clientHeight + 2;
        if (b) b.dataset.long = long ? "1" : "";
        if (b && !long) b.classList.remove("is-clamped");
        if (long || card.querySelector(".directive-photos")) card.querySelector("[data-more]").classList.remove("hidden");
      });
    }

    function directiveForm(d) {
      return formDialog({
        title: d ? "تعديل التوجيه" : "توجيه جديد",
        submitText: d ? "حفظ التعديل" : "نشر",
        values: d ? { title: d.title, content: d.content, images: d.images || [] } : {},
        fields: [
          { name: "title", label: "العنوان", type: "text", required: true, maxlength: 150 },
          { name: "content", label: "النص", type: "textarea", rows: 6, maxlength: 5000 },
          { name: "images", label: "الصور (حتى صورتين)", type: "images", max: MAX_DIRECTIVE_IMAGES, urlOf: directiveImageUrl },
        ],
        onSubmit: async (v) => {
          // نرفع الجديد أولًا، وبعد نجاح الحفظ نحذف المشالة
          const uploaded = [];
          try {
            for (const f of v.images.add) uploaded.push(await uploadDirectiveImage(f));
          } catch (e) {
            if (uploaded.length) await removeStorageFiles(DIRECTIVE_IMAGES_BUCKET, uploaded).catch(() => {});
            throw e;
          }
          const images = [...v.images.keep, ...uploaded];
          const removed = d ? (d.images || []).filter((p) => !v.images.keep.includes(p)) : [];
          const values = { title: v.title, content: v.content || null, images };
          try {
            if (d) {
              await updateRow("directives", d.id, values);
              Object.assign(d, values);
            } else {
              const row = await createRow("directives", values);
              items.unshift({ ...row, reads: 0 });
            }
          } catch (e) {
            if (uploaded.length) await removeStorageFiles(DIRECTIVE_IMAGES_BUCKET, uploaded).catch(() => {});
            throw e;
          }
          if (removed.length) await removeStorageFiles(DIRECTIVE_IMAGES_BUCKET, removed).catch(() => {});
        },
      });
    }

    (async () => {
      const profile = await requireAuth({ adminOnly: true });
      if (!profile) return;
      renderShell("settings");
      document.getElementById("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));
      document.getElementById("addBtn").innerHTML = svgIcon("plus");

      document.getElementById("addBtn").addEventListener("click", async () => {
        if (await directiveForm(null)) { render(); showToast("نُشر التوجيه"); }
      });

      document.getElementById("list").addEventListener("click", async (e) => {
        const photo = e.target.closest(".directive-photos button");
        if (photo) { openLightbox(photo.dataset.src); return; }
        const more = e.target.closest("[data-more]");
        if (more) {
          const card = more.closest(".directive");
          const open = more.getAttribute("aria-expanded") !== "true";
          const body = card.querySelector(".directive-body");
          if (body) body.classList.toggle("is-clamped", !open && body.dataset.long === "1");
          card.querySelector(".directive-photos")?.classList.toggle("hidden", !open);
          more.textContent = open ? "عرض أقل" : "المزيد";
          more.setAttribute("aria-expanded", String(open));
          return;
        }
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const d = items[Number(btn.dataset.i)];
        try {
          if (btn.dataset.act === "edit" && (await directiveForm(d))) { render(); showToast("حُفظ التعديل"); }
          if (btn.dataset.act === "delete") {
            const ok = await confirmDialog({ title: "حذف التوجيه", message: "سيختفي لدى جميع المستخدمين.", confirmText: "حذف التوجيه", danger: true });
            if (!ok) return;
            await deleteDirectiveCompletely(d);
            items = items.filter((x) => x.id !== d.id);
            render();
            showToast("حُذف التوجيه");
          }
        } catch (err) {
          showToast(adminErrorMessage(err));
        }
      });

      try {
        [items, activeUsers] = await Promise.all([fetchDirectivesWithReads(), countActiveUsers()]);
        render();
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    })();
  </script>
</body>
</html>
