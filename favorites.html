<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>المفضلة — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="index.html" id="crumb">الرئيسية</a>
    <div class="page-head">
      <div>
        <h1 class="page-title">المفضلة</h1>
        <p class="page-sub" id="countLabel">&nbsp;</p>
      </div>
    </div>
    <div id="favBox"><div class="card skeleton" style="height:180px"></div></div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="favorites.js"></script>
  <script>
    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderShell("home");
      document.getElementById("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));

      const box = document.getElementById("favBox");
      try {
        const favs = await fetchFavorites();
        document.getElementById("countLabel").textContent = `${favs.length} بند`;
        if (!favs.length) {
          box.innerHTML = `<div class="empty"><strong>لا توجد بنود في المفضلة</strong></div>`;
          return;
        }
        box.innerHTML = `<div class="card list-card">${favs.map((f) => {
          const it = f.item;
          const act = it.requirement?.activity?.name || "";
          const req = it.requirement?.name || "";
          return `
            <a class="list-row" href="item.html?id=${encodeURIComponent(it.id)}">
              ${svgIcon("star", "icon fav-star")}
              <span class="grow">
                <span class="row-title" style="display:block">${escapeHtml(it.title)}</span>
                <span class="row-sub" style="display:block">${escapeHtml(act)}${req ? "، " + escapeHtml(req) : ""}</span>
              </span>
              ${svgIcon("chevron", "icon-sm chev")}
            </a>`;
        }).join("")}</div>`;
      } catch (e) {
        box.innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    })();
  </script>
</body>
</html>
