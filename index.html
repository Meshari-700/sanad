<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <h1 class="page-title">سند</h1>
    <p class="page-sub">وصول سريع للاشتراطات حسب النشاط</p>

    <label class="search" style="margin-top:20px">
      <span id="searchIcon"></span>
      <input id="searchInput" type="search" placeholder="ابحث عن نشاط، مثل: صيدلية" autocomplete="off" aria-label="ابحث عن نشاط" />
    </label>

    <!-- نتائج البحث (تستبدل باقي الأقسام أثناء الكتابة) -->
    <section id="searchResults" class="hidden" aria-live="polite"></section>

    <div id="homeSections">
      <a class="feature-card" href="activities.html">
        <span class="brand-mark" id="featureIcon"></span>
        <span class="text">
          <span class="feature-title" style="display:block">تصفح الأنشطة</span>
          <span class="feature-sub" style="display:block">كل الاشتراطات مرتبة حسب نوع النشاط</span>
        </span>
        <span class="chev" id="featureChev"></span>
      </a>

      <section class="section">
        <div class="section-head">
          <span id="faqIcon"></span>
          <h2 class="section-title">الأسئلة الشائعة</h2>
          <span class="spacer"></span>
          <button class="icon-btn round primary hidden" id="faqAdd" aria-label="إضافة سؤال" style="width:44px;height:44px"></button>
        </div>
        <div id="faqBox"><div class="card skeleton" style="height:120px"></div></div>
      </section>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="content.js"></script>
  <script src="faqs.js"></script>
  <script src="admin.js"></script>
  <script src="admin-ui.js"></script>
  <script>
    let allActivities = [];
    function runSearch(q) {
      const results = document.getElementById("searchResults");
      const sections = document.getElementById("homeSections");
      if (!q.trim()) {
        results.classList.add("hidden");
        sections.classList.remove("hidden");
        return;
      }
      const matches = allActivities.filter((a) => matchesQuery(q, a.name));
      sections.classList.add("hidden");
      results.classList.remove("hidden");
      results.innerHTML = matches.length
        ? `<div class="section-head"><h2 class="section-title">النتائج</h2><span class="section-count">${matches.length}</span></div>
           <div class="tile-grid">${matches.map(activityTileHtml).join("")}</div>`
        : `<div class="empty"><strong>لا توجد نتائج</strong></div>`;
    }

    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderShell("home", { sync: true });

      document.getElementById("searchIcon").outerHTML = svgIcon("search");
      document.getElementById("featureIcon").innerHTML = svgIcon("grid");
      document.getElementById("featureChev").innerHTML = svgIcon("chevron");
      document.getElementById("faqIcon").outerHTML = svgIcon("help");
      initFaqs(document.getElementById("faqBox"), document.getElementById("faqAdd"), isAdminRole(profile));

      document.getElementById("searchInput").addEventListener("input", debounce((e) => runSearch(e.target.value), 150));

      try {
        allActivities = await fetchActivities();
      } catch (e) { /* البحث يرجع فاضي لو فشل التحميل */ }
    })();
  </script>
</body>
</html>
