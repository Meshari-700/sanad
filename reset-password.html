<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>تعيين كلمة المرور — سند</title>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-top">
      <img class="auth-logo" src="logo.png" alt="سند — مرجعك الموثوق في أعمال التفتيش" />
    </div>

    <div class="auth-body">
      <div class="card" id="box">
        <h2>تعيين كلمة مرور جديدة</h2>
        <p class="loading" id="checking">جارٍ التحقق من الرابط...</p>

        <div class="hidden" id="formWrap">
          <div class="field">
            <label for="pw1">كلمة المرور الجديدة</label>
            <input id="pw1" type="password" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="pw2">تأكيد كلمة المرور</label>
            <input id="pw2" type="password" autocomplete="new-password" />
          </div>
          <p class="msg" id="msg" role="alert"></p>
          <button class="btn block" id="saveBtn">حفظ كلمة المرور</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(text, type = "error") {
      $("msg").className = `msg ${type}`;
      $("msg").textContent = text;
    }

    function showExpired() {
      $("box").innerHTML = `
        <h2>الرابط غير صالح</h2>
        <p class="page-sub" style="margin:0 0 18px">رابط الاستعادة منتهي أو مستخدم من قبل.</p>
        <a class="btn block" href="login.html?reset=1">طلب رابط جديد</a>`;
    }

    async function save() {
      const p1 = $("pw1").value;
      const p2 = $("pw2").value;
      if (p1.length < 6) return showMsg("يجب ألا تقل كلمة المرور عن 6 أحرف.");
      if (p1 !== p2) return showMsg("كلمتا المرور غير متطابقتين.");

      $("saveBtn").disabled = true;
      showMsg("");
      try {
        const { error } = await supabaseClient.auth.updateUser({ password: p1 });
        if (error) throw error;
        sessionStorage.removeItem(PROFILE_CACHE_KEY);
        showMsg("تم تغيير كلمة المرور.", "success");
        setTimeout(() => window.location.replace("index.html"), 1200);
      } catch (e) {
        const m = (e && e.message) || "";
        showMsg(
          /different from the old/i.test(m) ? "اختر كلمة مرور مختلفة عن القديمة." :
          /session|jwt|expired/i.test(m) ? "انتهت صلاحية الرابط. اطلب رابط جديد." :
          /fetch|network/i.test(m) ? "تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى." :
          "تعذر حفظ كلمة المرور. حاول مرة أخرى."
        );
        $("saveBtn").disabled = false;
      }
    }

    (async () => {
      // الرابط المنتهي يرجع بخطأ في العنوان
      const hash = new URLSearchParams(window.location.hash.slice(1));
      if (hash.get("error") || getParam("error")) { showExpired(); return; }

      // مكتبة Supabase تقرأ رمز الاستعادة من الرابط وتفتح جلسة مؤقتة
      let { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        await new Promise((r) => setTimeout(r, 1200));
        ({ data: { session } } = await supabaseClient.auth.getSession());
      }
      if (!session) { showExpired(); return; }

      $("checking").classList.add("hidden");
      $("formWrap").classList.remove("hidden");
      $("pw1").focus();
      $("saveBtn").addEventListener("click", save);
      [$("pw1"), $("pw2")].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); }));
    })();
  </script>
</body>
</html>
