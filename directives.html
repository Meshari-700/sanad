<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>التوجيهات — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">التوجيهات</h1>
      </div>
    </div>
    <div id="list" aria-live="polite">
      <div class="card skeleton" style="height:130px"></div>
      <div class="card skeleton" style="height:130px"></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script>
    let readIds = new Set();

    async function markRead(card) {
      const id = card.dataset.id;
      if (readIds.has(id)) return;
      readIds.add(id);
      card.classList.remove("is-new");
      card.querySelector(".chip-gold")?.remove();
      try {
        await markDirectivesRead([id]);
        updateDirectivesDot();
      } catch (e) { readIds.delete(id); }
    }

    function toggle(card, open) {
      const body = card.querySelector(".directive-body");
      const btn = card.querySelector(".more-btn");
      body.classList.toggle("is-clamped", !open);
      btn.textContent = open ? "عرض أقل" : "المزيد";
      btn.setAttribute("aria-expanded", String(open));
      if (open) markRead(card);
    }

    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderHeader();
      renderBottomNav("directives");

      const list = document.getElementById("list");
      try {
        let items;
        [items, readIds] = await Promise.all([fetchDirectives(), fetchMyReadDirectiveIds()]);
        if (!items.length) {
          list.innerHTML = `<div class="empty"><strong>لا توجد توجيهات</strong></div>`;
          return;
        }
        list.innerHTML = items.map((d) => {
          const isNew = !readIds.has(d.id);
          return `
            <article class="card directive ${isNew ? "is-new" : ""}" data-id="${d.id}">
              <div class="directive-meta">
                <span class="directive-date">${formatDate(d.created_at)}</span>
                ${isNew ? `<span class="chip chip-gold">جديد</span>` : ""}
              </div>
              <h2 class="directive-title">${escapeHtml(d.title)}</h2>
              ${d.content ? `<p class="directive-body is-clamped">${escapeHtml(d.content)}</p>
                <button class="more-btn hidden" aria-expanded="false">المزيد</button>` : ""}
            </article>`;
        }).join("");

        // التوجيه القصير ينقرأ كامل من أول نظرة = يتسجّل مقروء مباشرة
        // الطويل يظهر له "المزيد"، وما يتسجّل مقروء إلا لما ينفتح
        const shortOnes = [];
        list.querySelectorAll(".directive").forEach((card) => {
          const body = card.querySelector(".directive-body");
          const long = body && body.scrollHeight > body.clientHeight + 2;
          if (long) {
            card.classList.add("is-expandable");
            card.querySelector(".more-btn").classList.remove("hidden");
          } else {
            body?.classList.remove("is-clamped");
            if (!readIds.has(card.dataset.id)) shortOnes.push(card);
          }
        });
        if (shortOnes.length) {
          shortOnes.forEach((c) => readIds.add(c.dataset.id));
          markDirectivesRead(shortOnes.map((c) => c.dataset.id)).then(updateDirectivesDot).catch(() => {});
        }

        list.addEventListener("click", (e) => {
          const card = e.target.closest(".directive.is-expandable");
          if (!card) return;
          const open = card.querySelector(".directive-body").classList.contains("is-clamped");
          toggle(card, open);
        });
      } catch (e) {
        list.innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    })();
  </script>
</body>
</html>
