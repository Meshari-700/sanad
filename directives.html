<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>التوجيهات — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">التوجيهات</h1>
      </div>
    </div>
    <div id="list" aria-live="polite">
      <div class="card skeleton" style="height:130px"></div>
      <div class="card skeleton" style="height:130px"></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script>
    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderHeader();
      renderBottomNav("directives");

      const list = document.getElementById("list");
      try {
        const [items, readIds] = await Promise.all([fetchDirectives(), fetchMyReadDirectiveIds()]);
        if (!items.length) {
          list.innerHTML = `<div class="empty"><strong>لا توجد توجيهات</strong></div>`;
          return;
        }
        list.innerHTML = items.map((d) => {
          const isNew = !readIds.has(d.id);
          return `
            <article class="card directive ${isNew ? "is-new" : ""}">
              <div class="directive-meta">
                <span class="directive-date">${formatDate(d.created_at)}</span>
                ${isNew ? `<span class="chip chip-green">جديد</span>` : ""}
              </div>
              <h2 class="directive-title">${escapeHtml(d.title)}</h2>
              ${d.content ? `<p class="directive-body">${escapeHtml(d.content)}</p>` : ""}
            </article>`;
        }).join("");

        // فتح الصفحة = قراءة كل التوجيهات الظاهرة، ثم تختفي نقطة التنبيه
        const unread = items.filter((d) => !readIds.has(d.id)).map((d) => d.id);
        if (unread.length) await markDirectivesRead(unread);
      } catch (e) {
        list.innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    })();
  </script>
</body>
</html>
