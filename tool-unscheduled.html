<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>الزيارات غير المجدولة — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="tools.html" id="crumb">الأدوات</a>
    <div class="page-head">
      <div>
        <h1 class="page-title">الزيارات غير المجدولة</h1>
        <p class="page-sub" id="count">&nbsp;</p>
      </div>
      <a class="icon-btn round primary" href="unscheduled-new.html" id="newBtn" aria-label="زيارة جديدة"></a>
    </div>

    <div class="filter-row hidden" id="userFilter">
      <select id="fUser" aria-label="عرض زيارات">
        <option value="mine" selected>زياراتي</option>
        <option value="all">جميع الزيارات</option>
      </select>
    </div>
    <div class="filter-row"><div id="fRange"></div></div>

    <button class="btn secondary block" id="exportBtn" style="margin-bottom:16px"></button>

    <div id="list"><div class="card skeleton" style="height:160px"></div></div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="daterange.js"></script>
  <script src="xlsx-lite.js"></script>
  <script src="unscheduled.js"></script>
  <script src="closures.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let profile = null;
    let isAdmin = false;
    let rows = [];
    let range = null;
    let loadSeq = 0;

    // المفتش يرى زياراته فقط، والمشرف يختار
    function filters() {
      const fu = isAdmin ? $("fUser").value : "mine";
      const r = range ? range.value : {};
      return {
        userId: fu === "mine" ? profile.id : fu === "all" ? null : fu,
        from: r.from, to: r.to,
        showAuthor: isAdmin && fu === "all",
        userLabel: isAdmin && fu !== "mine" && fu !== "all" ? $("fUser").selectedOptions[0].textContent : "",
      };
    }

    function render(f) {
      $("count").textContent = `${rows.length} زيارة`;
      $("exportBtn").disabled = !rows.length;
      if (!rows.length) {
        $("list").innerHTML = `<div class="empty"><strong>لا توجد زيارات</strong></div>`;
        return;
      }
      $("list").innerHTML = `<div class="card list-card">${rows.map((r) => {
        const sub = [(r.visit_date || "").split("-").join("/"), unscheduledReasonText(r)];
        if (f.showAuthor) sub.push(unscheduledAuthor(r));
        return `
          <button class="list-row" data-id="${r.id}">
            ${svgIcon("doc")}
            <span class="grow">
              <span class="row-title" style="display:block" dir="ltr">${escapeHtml(r.visit_number)}</span>
              <span class="row-sub" style="display:block">${escapeHtml(sub.filter(Boolean).join("، "))}</span>
            </span>
            ${svgIcon("chevron", "icon-sm chev")}
          </button>`;
      }).join("")}</div>`;
    }

    async function load() {
      const seq = ++loadSeq;
      const f = filters();
      $("list").innerHTML = `<div class="card skeleton" style="height:160px"></div>`;
      try {
        const data = await fetchUnscheduledVisits(f);
        if (seq !== loadSeq) return;
        rows = data;
        render(f);
      } catch (e) {
        if (seq === loadSeq) $("list").innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    }

    function openDetail(r) {
      const info = (label, value, ltr = false) => `<div class="info-row"><span class="info-label">${label}</span><span class="info-value" ${ltr ? 'dir="ltr"' : ""}>${escapeHtml(String(value ?? ""))}</span></div>`;
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <h3 dir="ltr" style="text-align:right">${escapeHtml(r.visit_number)}</h3>
          <p>${escapeHtml(unscheduledAuthor(r))}</p>
          <div class="card info-list" style="margin-bottom:14px">
            ${info("التاريخ", (r.visit_date || "").split("-").join("/"))}
            ${info("وقت التسجيل", unscheduledTime(r.created_at))}
            ${info("سبب فتح الزيارة", unscheduledReasonText(r))}
            ${info("رقم الزيارة السابقة أو البلاغ", r.previous_number || "—", !!r.previous_number)}
          </div>
          <div class="sheet-actions" style="margin-top:0">
            ${r.created_by === profile.id ? `<a class="btn block" href="unscheduled-new.html?id=${encodeURIComponent(r.id)}">تعديل الزيارة</a>` : ""}
            ${isAdmin ? `<button class="btn secondary block" data-delete style="color:var(--danger)">حذف الزيارة</button>` : ""}
            <button class="btn secondary block" data-close>إغلاق</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector("[data-close]").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      overlay.querySelector("[data-delete]")?.addEventListener("click", async () => {
        close();
        const ok = await confirmDialog({ title: "حذف الزيارة", message: "ستُحذف الزيارة نهائيًا.", confirmText: "حذف الزيارة", danger: true, typedWord: "حذف" });
        if (!ok) return;
        try {
          await deleteUnscheduledVisit(r.id);
          rows = rows.filter((x) => x.id !== r.id);
          render(filters());
          showToast("حُذفت الزيارة");
        } catch (e) {
          showToast("تعذر حذف الزيارة");
        }
      });
    }

    // التصدير متاح للجميع: المفتش يصدّر زياراته فقط (حسب الفلتر)، والمشرف حسب اختياره
    async function exportXlsx() {
      const btn = $("exportBtn");
      btn.disabled = true;
      btn.textContent = "جارٍ تجهيز الملف...";
      try {
        const f = filters();
        const blob = await exportUnscheduledXlsx(rows);
        let name = "الزيارات غير المجدولة";
        if (f.userLabel) name += ` - ${f.userLabel}`;
        else if (!f.showAuthor && profile.full_name) name += ` - ${profile.full_name}`;
        if (f.from) name += f.from === f.to ? ` ${f.from}` : ` ${f.from}_${f.to}`;
        await shareOrDownloadFile(blob, name.replace(/[\\/:*?"<>|]/g, "") + ".xlsx");
      } catch (e) {
        showToast("تعذر تجهيز ملف الإكسل");
      } finally {
        btn.disabled = !rows.length;
        btn.innerHTML = `${svgIcon("share", "icon-sm")}تحميل إكسل`;
      }
    }

    (async () => {
      profile = await requireAuth();
      if (!profile) return;
      isAdmin = isAdminRole(profile);
      renderShell("tools");
      $("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));
      $("newBtn").innerHTML = svgIcon("plus");
      $("exportBtn").innerHTML = `${svgIcon("share", "icon-sm")}تحميل إكسل`;
      range = createDateRangeField($("fRange"), { onChange: load });

      const saved = getParam("saved");
      if (saved) {
        showToast(saved === "edit" ? "حُفظ التعديل" : "حُفظت الزيارة");
        history.replaceState(null, "", "tool-unscheduled.html");
      }

      if (isAdmin) {
        $("userFilter").classList.remove("hidden");
        try {
          const { data } = await supabaseClient.from("profiles").select("id, full_name, email").order("full_name");
          $("fUser").insertAdjacentHTML("beforeend", (data || [])
            .filter((u) => u.id !== profile.id)
            .map((u) => `<option value="${u.id}">${escapeHtml(u.full_name || u.email || "بدون اسم")}</option>`).join(""));
        } catch (e) {}
        $("fUser").addEventListener("change", load);
      }

      $("exportBtn").addEventListener("click", exportXlsx);
      $("list").addEventListener("click", (e) => {
        const row = e.target.closest("[data-id]");
        if (row) openDetail(rows.find((r) => r.id === row.dataset.id));
      });
      load();
    })();
  </script>
</body>
</html>
