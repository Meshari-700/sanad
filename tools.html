<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>الأدوات — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">الأدوات</h1>
        <p class="page-sub" id="countLabel">&nbsp;</p>
      </div>
      <a class="icon-btn round primary hidden" id="manageBtn" href="admin-tools.html" aria-label="إدارة الأدوات"></a>
    </div>

    <div id="toolsBox" aria-live="polite">
      <div class="tile-grid"><div class="tile skeleton"></div><div class="tile skeleton"></div></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="content.js"></script>
  <script src="tools.js"></script>
  <script>
    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderShell("tools");

      if (isAdminRole(profile)) {
        const m = document.getElementById("manageBtn");
        m.innerHTML = svgIcon("edit");
        m.classList.remove("hidden");
      }

      const box = document.getElementById("toolsBox");
      box.addEventListener("click", (e) => {
        const t = e.target.closest("[data-unavailable]");
        if (!t) return;
        e.preventDefault();
        showToast("الأداة غير متاحة حاليًا");
      });

      try {
        const tools = await fetchTools();
        const visibleCount = tools.filter((t) => !t.is_hidden).length;
        document.getElementById("countLabel").textContent = `${visibleCount} أداة`;
        box.innerHTML = tools.length
          ? `<div class="tile-grid">${tools.map(toolTileHtml).join("")}</div>`
          : `<div class="empty"><strong>لا توجد أدوات</strong></div>`;
      } catch (e) {
        box.innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    })();
  </script>
</body>
</html>
