<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>لوحة الإشراف — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="settings.html" id="crumb">الإعدادات</a>
    <h1 class="page-title">لوحة الإشراف</h1>

    <div class="card list-card">
      <a class="list-row" href="admin-activities.html" id="lnkActivities">
        <span class="grow"><span class="row-title" style="display:block">الأنشطة والاشتراطات</span><span class="row-sub" style="display:block">المجموعات، الأنشطة، الاشتراطات، البنود والصور</span></span>
      </a>
      <a class="list-row" href="admin-directives.html" id="lnkDirectives">
        <span class="grow"><span class="row-title" style="display:block">التوجيهات</span><span class="row-sub" style="display:block">نشر التوجيهات ومتابعة من قرأها</span></span>
      </a>
      <a class="list-row" href="admin-tools.html" id="lnkTools">
        <span class="grow"><span class="row-title" style="display:block">الأدوات</span><span class="row-sub" style="display:block">الروابط والملفات</span></span>
      </a>
      <a class="list-row hidden" href="users.html" id="lnkUsers">
        <span class="grow"><span class="row-title" style="display:block">المستخدمون</span><span class="row-sub" style="display:block">الأدوار وتعطيل الحسابات</span></span>
      </a>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script>
    (async () => {
      const profile = await requireAuth({ adminOnly: true });
      if (!profile) return;
      renderShell("settings");
      document.getElementById("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));
      [["lnkActivities", "grid"], ["lnkDirectives", "megaphone"], ["lnkTools", "tool"], ["lnkUsers", "users"]].forEach(([id, icon]) => {
        const el = document.getElementById(id);
        el.insertAdjacentHTML("afterbegin", svgIcon(icon));
        el.insertAdjacentHTML("beforeend", svgIcon("chevron", "icon-sm chev"));
      });
      if (profile.role === "owner") document.getElementById("lnkUsers").classList.remove("hidden");
    })();
  </script>
</body>
</html>
