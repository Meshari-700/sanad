<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>تقارير الزيارات اليومية — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="tools.html" id="crumb">الأدوات</a>
    <div class="page-head">
      <div>
        <h1 class="page-title">الزيارات اليومية</h1>
        <p class="page-sub" id="count">&nbsp;</p>
      </div>
      <a class="icon-btn round primary" href="daily-new.html" id="newBtn" aria-label="تقرير جديد"></a>
    </div>

    <div class="filter-row hidden" id="userFilter">
      <select id="fUser" aria-label="عرض تقارير">
        <option value="mine" selected>تقاريري</option>
        <option value="all">جميع التقارير</option>
      </select>
    </div>
    <div class="filter-row">
      <select id="fMuni" aria-label="البلدية"><option value="">كل البلديات</option></select>
    </div>
    <div class="filter-row"><div id="fRange"></div></div>

    <div class="daily-summary hidden" id="summary"></div>
    <button class="btn secondary block" id="exportBtn" style="margin-bottom:16px"></button>

    <div id="list"><div class="card skeleton" style="height:160px"></div></div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="daterange.js"></script>
  <script src="xlsx-lite.js"></script>
  <script src="daily.js"></script>
  <script src="closures.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let profile = null;
    let isAdmin = false;
    let rows = [];
    let range = null;
    let loadSeq = 0;

    function filters() {
      const fu = isAdmin ? $("fUser").value : "mine";
      const r = range ? range.value : {};
      return {
        userId: fu === "mine" ? profile.id : fu === "all" ? null : fu,
        municipality: $("fMuni").value || null,
        from: r.from, to: r.to,
        showAuthor: isAdmin && fu !== "mine",
      };
    }

    function authorName(r) {
      return r.inspector_name || (r.author && (r.author.full_name || r.author.email)) || "";
    }

    function render(f) {
      $("count").textContent = `${rows.length} تقرير`;
      $("exportBtn").disabled = !rows.length;
      const total = (k) => rows.reduce((n, r) => n + (Number(r[k]) || 0), 0);
      const visits = rows.reduce((n, r) => n + dailyVisits(r), 0);
      $("summary").classList.toggle("hidden", !rows.length);
      $("summary").innerHTML = `
        <div><strong>${visits}</strong><span>زيارة</span></div>
        <div><strong>${total("closures_count")}</strong><span>إغلاق</span></div>
        <div><strong>${total("complaints_count")}</strong><span>بلاغ</span></div>`;

      if (!rows.length) {
        $("list").innerHTML = `<div class="empty"><strong>لا توجد تقارير</strong></div>`;
        return;
      }
      $("list").innerHTML = `<div class="card list-card">${rows.map((r) => {
        const sub = [`${dailyVisits(r)} زيارة`, r.municipality];
        if (f.showAuthor) sub.push(authorName(r));
        return `
          <button class="list-row" data-id="${r.id}">
            ${svgIcon("doc")}
            <span class="grow">
              <span class="row-title" style="display:block">${escapeHtml((r.report_date || "").split("-").join("/"))}</span>
              <span class="row-sub" style="display:block">${escapeHtml(sub.filter(Boolean).join("، "))}</span>
            </span>
            ${svgIcon("chevron", "icon-sm chev")}
          </button>`;
      }).join("")}</div>`;
    }

    async function load() {
      const seq = ++loadSeq;
      const f = filters();
      $("list").innerHTML = `<div class="card skeleton" style="height:160px"></div>`;
      try {
        const data = await fetchDailyReports(f);
        if (seq !== loadSeq) return;
        rows = data;
        render(f);
      } catch (e) {
        if (seq === loadSeq) $("list").innerHTML = `<div class="empty">تعذر التحميل، تحقق من الاتصال</div>`;
      }
    }

    function openDetail(r) {
      const info = (label, value) => `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${escapeHtml(String(value ?? ""))}</span></div>`;
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <h3>${escapeHtml((r.report_date || "").split("-").join("/"))}</h3>
          <p>${escapeHtml(authorName(r))}، ${escapeHtml(r.municipality || "")}</p>
          <div class="card info-list" style="margin-bottom:14px">
            ${info("نوع الرقابة", controlTypesText(r.control_types))}
            ${info("عدد الزيارات", dailyVisits(r))}
            ${DAILY_COUNTS.map((c) => info(c.label, r[c.key] || 0)).join("")}
            ${DAILY_EXTRA_COUNTS.map((c) => info(c.label, r[c.key] || 0)).join("")}
          </div>
          ${r.shortage_reason ? `<div class="card" style="margin-bottom:14px"><div class="card-head">سبب النقص</div><p class="card-text">${escapeHtml(r.shortage_reason)}</p></div>` : ""}
          ${r.notes ? `<div class="card" style="margin-bottom:14px"><div class="card-head">ملاحظات</div><p class="card-text">${escapeHtml(r.notes)}</p></div>` : ""}
          <div class="sheet-actions" style="margin-top:0">
            ${r.created_by === profile.id ? `<a class="btn block" href="daily-new.html?id=${encodeURIComponent(r.id)}">تعديل التقرير</a>` : ""}
            ${isAdmin ? `<button class="btn secondary block" data-delete style="color:var(--danger)">حذف التقرير</button>` : ""}
            <button class="btn secondary block" data-close>إغلاق</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector("[data-close]").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      overlay.querySelector("[data-delete]")?.addEventListener("click", async () => {
        close();
        const ok = await confirmDialog({ title: "حذف التقرير", message: "سيُحذف التقرير نهائيًا.", confirmText: "حذف التقرير", danger: true, typedWord: "حذف" });
        if (!ok) return;
        try {
          await deleteDailyReport(r.id);
          rows = rows.filter((x) => x.id !== r.id);
          render(filters());
          showToast("حُذف التقرير");
        } catch (e) {
          showToast("تعذر حذف التقرير");
        }
      });
    }

    async function exportXlsx() {
      const btn = $("exportBtn");
      btn.disabled = true;
      btn.textContent = "جارٍ تجهيز الملف...";
      try {
        const f = filters();
        const blob = await exportDailyXlsx(rows, { splitByMunicipality: !f.municipality });
        let name = "الزيارات اليومية";
        if (f.from) name += f.from === f.to ? ` ${f.from}` : ` ${f.from}_${f.to}`;
        if (f.municipality) name += ` - ${f.municipality}`;
        await shareOrDownloadFile(blob, name + ".xlsx");
      } catch (e) {
        showToast("تعذر تجهيز ملف الإكسل");
      } finally {
        btn.disabled = !rows.length;
        btn.innerHTML = `${svgIcon("share", "icon-sm")}تحميل إكسل`;
      }
    }

    (async () => {
      profile = await requireAuth();
      if (!profile) return;
      isAdmin = isAdminRole(profile);
      renderShell("tools");
      $("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));
      $("newBtn").innerHTML = svgIcon("plus");
      $("exportBtn").innerHTML = `${svgIcon("share", "icon-sm")}تحميل إكسل`;
      $("fMuni").insertAdjacentHTML("beforeend", MUNICIPALITIES.map((m) => `<option value="${m}">${m}</option>`).join(""));
      range = createDateRangeField($("fRange"), { onChange: load });

      const saved = getParam("saved");
      if (saved) {
        showToast(saved === "edit" ? "حُفظ التعديل" : "حُفظ التقرير");
        history.replaceState(null, "", "tool-daily.html");
      }

      if (isAdmin) {
        $("userFilter").classList.remove("hidden");
        try {
          const { data } = await supabaseClient.from("profiles").select("id, full_name, email").order("full_name");
          $("fUser").insertAdjacentHTML("beforeend", (data || [])
            .filter((u) => u.id !== profile.id)
            .map((u) => `<option value="${u.id}">${escapeHtml(u.full_name || u.email || "بدون اسم")}</option>`).join(""));
        } catch (e) {}
      }

      ["fUser", "fMuni"].forEach((id) => $(id).addEventListener("change", load));
      $("exportBtn").addEventListener("click", exportXlsx);
      $("list").addEventListener("click", (e) => {
        const row = e.target.closest("[data-id]");
        if (row) openDetail(rows.find((r) => r.id === row.dataset.id));
      });
      load();
    })();
  </script>
</body>
</html>
