<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#126151" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="سند" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cttooytoziipdcasliah.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>البند — سند</title>
</head>
<body>
  <header id="appHeader"></header>

  <main class="page">
    <a class="breadcrumb" href="activities.html" id="crumb">رجوع</a>
    <div id="content">
      <div class="card skeleton" style="height:200px"></div>
      <div class="card skeleton" style="height:120px"></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="utils.js"></script>
  <script src="directives.js"></script>
  <script src="layout.js"></script>
  <script src="content.js"></script>
  <script src="favorites.js"></script>
  <script>
    const itemId = getParam("id");

    function render(item, fav) {
      const req = item.requirement || {};
      const act = req.activity || {};
      const images = item.images || [];

      const crumb = document.getElementById("crumb");
      if (act.id) {
        crumb.href = `activity.html?id=${encodeURIComponent(act.id)}`;
        crumb.innerHTML = svgIcon("chevron", "icon-sm") + escapeHtml(act.name);
      }
      document.title = `${item.title} — سند`;

      document.getElementById("content").innerHTML = `
        <article class="card">
          <div class="detail-top">
            <div class="detail-tags">
              ${svgIcon("layers")}
              ${req.name ? `<span class="chip chip-green">${escapeHtml(req.name)}</span>` : ""}
              ${item.is_suspended ? `<span class="chip chip-muted">${svgIcon("pause", "icon-sm")}موقوف</span>` : ""}
            </div>
            <div class="detail-actions">
              <button class="icon-btn ${fav ? "is-on" : ""}" id="favBtn" aria-pressed="${fav}" aria-label="${fav ? "إزالة من المفضلة" : "إضافة للمفضلة"}">${svgIcon("star")}</button>
            </div>
          </div>
          <h1 class="detail-title">${escapeHtml(item.title)}</h1>
          ${item.description ? `<p class="detail-desc">${escapeHtml(item.description)}</p>` : ""}
        </article>

        <div class="card info-list">
          <div class="info-row">${svgIcon("book")}<span class="info-label">النشاط</span><span class="info-value">${escapeHtml(act.name || "")}</span></div>
          <div class="info-row">${svgIcon("layers")}<span class="info-label">الاشتراط</span><span class="info-value">${escapeHtml(req.name || "")}</span></div>
        </div>

        ${item.notes ? `
          <section class="card">
            <div class="card-head">${svgIcon("note")}ملاحظات</div>
            <p class="card-text">${escapeHtml(item.notes)}</p>
          </section>` : ""}

        ${images.length ? `
          <section class="card">
            <div class="card-head">${svgIcon("image")}الصور</div>
            <div class="photo-row">
              ${images.map((img) => {
                const url = itemImageUrl(img.storage_path);
                return `<button data-src="${escapeHtml(url)}" aria-label="عرض الصورة"><img src="${escapeHtml(url)}" alt="" loading="lazy" /></button>`;
              }).join("")}
            </div>
          </section>` : ""}
      `;

      document.querySelectorAll(".photo-row button").forEach((b) =>
        b.addEventListener("click", () => openLightbox(b.dataset.src))
      );

      const favBtn = document.getElementById("favBtn");
      favBtn.addEventListener("click", async () => {
        const on = favBtn.getAttribute("aria-pressed") === "true";
        favBtn.disabled = true;
        try {
          on ? await removeFavorite(item.id) : await addFavorite(item.id);
          favBtn.classList.toggle("is-on", !on);
          favBtn.setAttribute("aria-pressed", String(!on));
          favBtn.setAttribute("aria-label", !on ? "إزالة من المفضلة" : "إضافة للمفضلة");
          showToast(!on ? "أُضيف البند للمفضلة" : "أُزيل البند من المفضلة");
        } catch (e) {
          showToast("تعذر تحديث المفضلة. حاول مرة ثانية.");
        } finally {
          favBtn.disabled = false;
        }
      });
    }

    (async () => {
      const profile = await requireAuth();
      if (!profile) return;
      renderShell("home");
      document.getElementById("crumb").insertAdjacentHTML("afterbegin", svgIcon("chevron", "icon-sm"));

      const box = document.getElementById("content");
      if (!itemId) {
        box.innerHTML = `<div class="empty"><strong>البند غير موجود</strong>ارجع لقائمة الأنشطة واختر بندًا</div>`;
        return;
      }
      try {
        const [item, fav] = await Promise.all([fetchItem(itemId), isFavorite(itemId)]);
        if (!item) {
          box.innerHTML = `<div class="empty"><strong>البند غير موجود</strong>ربما حُذف. ارجع لقائمة الأنشطة.</div>`;
          return;
        }
        render(item, fav);
      } catch (e) {
        box.innerHTML = `<div class="empty">تعذر تحميل البند. تحقق من الاتصال وأعد فتح الصفحة.</div>`;
      }
    })();
  </script>
</body>
</html>
